# Merge this block into the existing CPA configuration.
# Enter the existing CPA management key below or in the plugin settings form.
plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-plus:
      enabled: true
      priority: 100
      cpa_url: "http://127.0.0.1:8317"
      management_key: ""
      providers: ["claude", "codex"]
      # No periodic polling. Requests trigger refresh after invalidation.
      cache_ttl: "5m"
      retry_interval: "20s"
      request_timeout: "10s"
