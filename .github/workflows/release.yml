name: Build and release

on:
  push:
    branches: [main]
    tags: ['v0.1.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^0\.1\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" == "v$version" ]]
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Go code
        run: make check

      - name: Install Zig 0.15.2
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Build Linux amd64 package
        run: make package-linux-amd64 LINUX_AMD64_CC='zig cc -target x86_64-linux-gnu.2.17'

      - name: Verify native ABI and scheduling
        run: python3 scripts/smoke.py build/linux-amd64/cpa-plus.so

      - name: Verify package checksum
        working-directory: dist
        run: sha256sum --check *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
